name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-runtime mono-mcs libmono-system-windows-forms4.0-cil libmono-system-net-http4.0-cil libmono-system-web-extensions4.0-cil
      - name: Compile the add-in and run the logic tests
        run: tests/run-tests.sh
